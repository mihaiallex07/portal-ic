<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Beneficiar — Inginerie Creativă</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <style>
    :root{--brand:#FFCB09;--ink:#171717;--muted:#6B7280;--border:#E5E7EB;--surface:#fff;--canvas:#F5F6F8;--green:#10B981;--orange:#F59E0B;--red:#EF4444;--blue:#3B82F6}
    *{box-sizing:border-box} body{margin:0;background:var(--canvas);color:var(--ink);font-family:Barlow,Arial,sans-serif;font-size:14px}
    button,input{font:inherit}.topbar{height:64px;background:#1A1A1A;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,42px);box-shadow:0 1px 3px #0003}.brand{display:flex;align-items:center;gap:12px}.brand img{height:31px;max-width:140px;object-fit:contain}.portal-badge{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--brand);color:#171717;border-radius:999px;padding:6px 11px}
    .auth-shell{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:28px 16px}.auth-card{width:100%;max-width:480px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:34px;box-shadow:0 16px 44px #17203316}.auth-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:#FFF6CD;font-size:25px;margin-bottom:16px}.auth-card h1{font-size:25px;line-height:1.15;margin:0 0 8px}.auth-card p{color:var(--muted);line-height:1.55;margin:0 0 22px}.label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:#374151}.input{width:100%;border:1px solid #CBD5E1;border-radius:8px;padding:11px 12px;outline:none;background:#fff}.input:focus{border-color:#D6A800;box-shadow:0 0 0 3px #FFCB0936}.btn{border:0;border-radius:8px;font-weight:800;cursor:pointer;padding:11px 14px}.btn-brand{background:var(--brand);color:#181818}.btn-brand:hover{background:#F4BD00}.btn-secondary{border:1px solid #D1D5DB;background:#fff;color:#374151}.btn:disabled{opacity:.6;cursor:not-allowed}.auth-actions{display:flex;gap:10px;margin-top:18px}.auth-actions .btn{flex:1}.notice{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.45}.notice-error{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA}.notice-info{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}.code-input{letter-spacing:.35em;text-align:center;font-size:20px;font-weight:800}
    .hero{background:linear-gradient(135deg,#161616,#2C2C2C);border-bottom:4px solid var(--brand);color:#fff;padding:38px clamp(16px,4vw,42px) 30px}.hero-inner,.page-main{max-width:1280px;margin:auto}.project-code{display:inline-block;border-radius:5px;background:var(--brand);color:#171717;font-size:13px;font-weight:800;letter-spacing:.05em;padding:5px 11px;margin-bottom:12px}.project-title{font-size:clamp(28px,4vw,38px);line-height:1.1;margin:0 0 8px}.meta{color:#D1D5DB;font-size:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.status{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.status-activ{color:#065F46;background:#D1FAE5}.status-in_progress{color:#1E40AF;background:#DBEAFE}.status-finalizat{color:#374151;background:#F3F4F6}.status-suspendat,.status-arhivat{color:#9A3412;background:#FFEDD5}.progress-wrap{margin-top:24px}.progress-track{height:10px;border-radius:999px;background:#ffffff1f;overflow:hidden}.progress-fill{height:100%;border-radius:inherit;background:var(--brand)}.progress-label{display:flex;justify-content:space-between;margin-top:7px;color:#D1D5DB;font-size:13px}.progress-label strong{color:var(--brand)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:23px}.stat{background:#ffffff0b;border:1px solid #ffffff14;border-radius:10px;padding:15px 17px}.stat-value{font-size:25px;font-weight:800;color:var(--brand);line-height:1}.stat-label{margin-top:5px;color:#B6BBC3;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .page-main{padding:26px clamp(16px,4vw,42px) 56px}.view-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;font-size:13px;color:var(--muted)}.view-pill{display:inline-flex;align-items:center;gap:7px;background:#FFF9DC;border:1px solid #F6DB72;color:#735B00;border-radius:999px;padding:6px 10px;font-weight:700}.tabs{display:flex;gap:2px;overflow:auto;border-bottom:1px solid var(--border);margin-bottom:22px}.tab{appearance:none;background:transparent;border:0;border-bottom:3px solid transparent;color:#6B7280;cursor:pointer;white-space:nowrap;padding:12px 15px 10px;font-size:13px;font-weight:700}.tab.active{color:#242424;border-bottom-color:var(--brand)}.section-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px #17203308;margin-bottom:15px}.section-title{font-size:16px;margin:0 0 15px;font-weight:800}.phase-head{display:flex;align-items:center;gap:10px;padding:16px 18px;cursor:pointer;background:#fff}.phase-head:hover{background:#FCFCFC}.phase-dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}.phase-name{font-weight:800;flex:1}.phase-values{font-size:12px;color:var(--muted);font-weight:700}.chevron{font-size:17px;color:var(--muted);transition:transform .15s}.phase-head.open .chevron{transform:rotate(90deg)}.phase-progress{height:4px;background:#F0F1F3;margin:0 18px}.phase-progress-fill{height:100%;border-radius:4px}.task-list{display:none;padding:5px 18px 12px}.task-list.open{display:block}.task-row{display:grid;grid-template-columns:minmax(215px,2.2fr) minmax(110px,1fr) 72px 72px 76px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #F0F1F3}.task-row:last-child{border-bottom:0}.task-name{font-weight:700}.task-description{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}.task-period,.number{font-size:12px;color:#4B5563}.small-progress{height:5px;background:#E5E7EB;border-radius:999px;overflow:hidden}.small-progress>span{display:block;height:100%;border-radius:inherit}.pct{font-size:12px;font-weight:800;text-align:right}.task-mobile-meta{display:none}
    .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.member{border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;gap:11px;align-items:center}.avatar,.avatar-fallback{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#FFF1A4;display:grid;place-items:center;font-weight:800;color:#695100;flex:0 0 38px}.member-name{font-weight:800}.member-meta{font-size:12px;color:var(--muted);margin-top:2px}.role{display:inline-flex;margin-top:5px;background:#F3F4F6;border-radius:999px;padding:2px 7px;color:#4B5563;font-size:10px;text-transform:uppercase;font-weight:800}.report-table{width:100%;border-collapse:collapse}.report-table th{background:#F9FAFB;color:#6B7280;text-transform:uppercase;letter-spacing:.05em;font-size:10px;text-align:left;padding:10px 13px}.report-table td{border-top:1px solid #F0F1F3;padding:12px 13px;font-size:13px}.report-table td:last-child,.report-table th:last-child{text-align:right}.change{border-left:3px solid #E5E7EB;padding:0 0 0 13px;margin:0 0 16px}.change-title{font-weight:800}.change-info{font-size:12px;color:var(--muted);margin-top:3px}.change-values{display:grid;gap:4px;margin-top:7px;font-size:12px}.old{color:#B91C1C}.new{color:#047857}.decision{border-left:3px solid var(--brand);padding:0 0 0 13px;margin:0 0 19px}.decision-date{font-size:12px;font-weight:800;color:#6B7280}.decision-text{font-size:14px;line-height:1.6;margin-top:5px}.decision-meta{font-size:12px;color:var(--muted);margin-top:7px}.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}.card-pad{padding:19px}.footer{background:#1A1A1A;color:#9CA3AF;text-align:center;padding:18px;font-size:12px}
    @media(max-width:760px){.topbar{height:56px}.brand img{height:24px}.portal-badge{font-size:9px;padding:5px 8px}.hero{padding-top:29px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.task-row{grid-template-columns:1fr 55px;gap:8px}.task-period,.number,.small-progress{display:none}.task-mobile-meta{display:block;font-size:11px;color:var(--muted);margin-top:5px}.pct{align-self:center}.report-table{min-width:560px}.table-wrap{overflow:auto}.auth-card{padding:27px 22px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="assets/logo-full.png" alt="Inginerie Creativă" /></div>
    <span class="portal-badge">Portal beneficiar</span>
  </header>
  <main id="app"><div class="auth-shell"><div class="auth-card"><div class="auth-icon">⏳</div><h1>Se încarcă invitația</h1><p>Verificăm accesul securizat la proiect.</p></div></div></main>
  <footer class="footer">© 2026 Inginerie Creativă · Portal beneficiar</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const BENEFICIARY_PORTAL_VERSION = 'secure-email-bound-20260923';
    const SUPABASE_URL = 'https://ofknvxwcqwgnthnvslfl.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdWIiLCJyZWYiOiJvZmtudnh3Y3F3Z250aG52c2xmbCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc4NjAyMDU3LCJleHAiOjIwOTQxNzgwNTd9.HhI-MAeGlmFIIEfL1mDWxQhKBbCPDn3qgaSKBS9otS8';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    const params = new URLSearchParams(location.search);
    const invitationToken = params.get('invitation') || params.get('token');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const formatDate = value => value ? new Date(value + (String(value).length === 10 ? 'T12:00:00' : '')).toLocaleDateString('ro-RO',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    const formatHours = minutes => `${Math.round((Number(minutes)||0) / 60 * 10) / 10}h`;
    const roleLabel = role => ({admin:'Administrator',coordonator:'Coordonator',coord:'Coordonator',angajat:'Membru echipă',colaborator_extern:'Colaborator extern'}[role] || role || 'Membru echipă');
    const app = document.getElementById('app');
    let snapshot = null, activeTab = 'tasks', refreshTimer = null;

    function sessionKey(){ return invitationToken ? `ic_beneficiary_session_${invitationToken}` : null; }
    function getSession(){ try{return sessionStorage.getItem(sessionKey())}catch(_){return null} }
    function clearSession(){ try{sessionStorage.removeItem(sessionKey())}catch(_){} }
    function errorPage(title, message){ app.innerHTML = `<div class="auth-shell"><div class="auth-card"><div class="auth-icon">🔒</div><h1>${escapeHtml(title)}</h1><p>${escapeHtml(message)}</p>${invitationToken ? '<button class="btn btn-brand" onclick="showEmailStep()">Confirmă adresa invitată</button>' : ''}</div></div>`; }

    function showEmailStep(){
      if (!invitationToken) { errorPage('Link incomplet','Invitația nu conține identificatorul necesar. Contactează echipa proiectului pentru o invitație nouă.'); return; }
      clearInterval(refreshTimer); refreshTimer = null;
      app.innerHTML = `<div class="auth-shell"><section class="auth-card"><div class="auth-icon">✉️</div><h1>Confirmă adresa invitată</h1><p>Pentru a proteja informațiile proiectului, codul de acces va fi trimis numai la adresa de e-mail setată în invitație.</p><label class="label" for="benef-email">Adresă e-mail</label><input id="benef-email" class="input" autocomplete="email" type="email" placeholder="nume@companie.ro" /><div id="auth-message"></div><div class="auth-actions"><button class="btn btn-brand" id="send-code" onclick="requestCode()">Trimite codul de acces</button></div></section></div>`;
      setTimeout(()=>document.getElementById('benef-email')?.focus(),20);
    }

    function authMessage(message, type='info'){ const box=document.getElementById('auth-message'); if(box) box.innerHTML=`<div class="notice notice-${type}">${escapeHtml(message)}</div>`; }
    async function requestCode(){
      const email = document.getElementById('benef-email')?.value.trim().toLowerCase();
      const button = document.getElementById('send-code');
      if(!email || !email.includes('@')){ authMessage('Introdu o adresă de e-mail validă.','error'); return; }
      button.disabled=true; button.textContent='Se trimite…';
      const {data,error}=await sb.rpc('beneficiary_request_email_verification',{p_invitation_token:invitationToken,p_email:email});
      button.disabled=false; button.textContent='Trimite codul de acces';
      if(error){authMessage('Nu s-a putut trimite codul. Încearcă din nou peste câteva momente.','error');return;}
      showCodeStep(email, data?.message || 'Dacă invitația este activă, codul a fost trimis la adresa configurată.');
    }

    function showCodeStep(email,message){
      app.innerHTML = `<div class="auth-shell"><section class="auth-card"><div class="auth-icon">🔐</div><h1>Introdu codul de acces</h1><p>${escapeHtml(message)}</p><label class="label" for="benef-code">Cod cu 6 cifre</label><input id="benef-code" inputmode="numeric" maxlength="6" class="input code-input" autocomplete="one-time-code" placeholder="000000" /><div id="auth-message"></div><div class="auth-actions"><button class="btn btn-secondary" onclick="showEmailStep()">Înapoi</button><button class="btn btn-brand" id="verify-code" onclick="verifyCode('${encodeURIComponent(email)}')">Deschide proiectul</button></div><p style="font-size:12px;margin-top:18px;color:var(--muted)">Codul expiră în 15 minute și funcționează numai împreună cu adresa de e-mail invitată.</p></section></div>`;
      setTimeout(()=>document.getElementById('benef-code')?.focus(),20);
    }

    async function verifyCode(encodedEmail){
      const email=decodeURIComponent(encodedEmail); const code=document.getElementById('benef-code')?.value.trim(); const button=document.getElementById('verify-code');
      if(!/^\d{6}$/.test(code||'')){authMessage('Introdu codul de 6 cifre primit pe e-mail.','error');return;}
      button.disabled=true;button.textContent='Se verifică…';
      const {data,error}=await sb.rpc('beneficiary_verify_email_access',{p_invitation_token:invitationToken,p_email:email,p_code:code});
      button.disabled=false;button.textContent='Deschide proiectul';
      if(error || !data?.ok){authMessage(data?.message || 'Codul nu a putut fi verificat.','error');return;}
      try{sessionStorage.setItem(sessionKey(),data.session_token)}catch(_){}
      await loadSnapshot();
    }

    async function loadSnapshot(){
      const sessionToken=getSession();
      if(!sessionToken){showEmailStep();return;}
      const {data,error}=await sb.rpc('beneficiary_get_project_snapshot',{p_session_token:sessionToken});
      if(error || !data?.ok){clearSession();showEmailStep();return;}
      snapshot=data; renderPortal();
      clearInterval(refreshTimer); refreshTimer=setInterval(async()=>{ const {data:next}=await sb.rpc('beneficiary_get_project_snapshot',{p_session_token:getSession()}); if(next?.ok){snapshot=next;renderPortal({preserveTab:true});} },60000);
    }

    function statusClass(status){return `status-${String(status||'').replace(/[^a-z_]/g,'')}`;}
    function taskProgress(task){ const budget=Number(task.budget_hours)||0; return budget>0 ? Math.min(100,Math.round(((Number(task.minutes_worked)||0)/60/budget)*100)) : (task.status==='done'?100:0); }
    function phaseData(phase){const tasks=(snapshot.tasks||[]).filter(t=>String(t.phase_id)===String(phase.id));const budget=tasks.reduce((sum,t)=>sum+(Number(t.budget_hours)||0),0);const worked=tasks.reduce((sum,t)=>sum+(Number(t.minutes_worked)||0),0);return {tasks,budget,worked,pct:budget>0?Math.min(100,Math.round(worked/60/budget*100)):0};}
    function totalData(){const tasks=snapshot.tasks||[];const budget=tasks.reduce((sum,t)=>sum+(Number(t.budget_hours)||0),0);const worked=tasks.reduce((sum,t)=>sum+(Number(t.minutes_worked)||0),0);const done=tasks.filter(t=>t.status==='done').length;return {tasks,budget,worked,done,pct:budget>0?Math.min(100,Math.round(worked/60/budget*100)):0};}

    function renderPortal(options={}){
      const p=snapshot.project, totals=totalData(), phases=snapshot.phases||[];
      app.innerHTML=`
        <section class="hero"><div class="hero-inner"><div class="project-code">${escapeHtml(p.code||p.abbreviation||'IC')}</div><h1 class="project-title">${escapeHtml(p.name)}</h1><div class="meta">${p.client_name?`<strong>${escapeHtml(p.client_name)}</strong><span>·</span>`:''}<span>${formatDate(p.start_date)} — ${formatDate(p.end_date)}</span><span>·</span><span class="status ${statusClass(p.status)}">${escapeHtml(String(p.status||'activ').replace('_',' '))}</span></div><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${totals.pct}%"></div></div><div class="progress-label"><span>Progres total</span><span><strong>${totals.pct}%</strong> finalizat</span></div></div><div class="stats"><div class="stat"><div class="stat-value">${totals.pct}%</div><div class="stat-label">Progres</div></div><div class="stat"><div class="stat-value">${phases.length}</div><div class="stat-label">Etape</div></div><div class="stat"><div class="stat-value">${totals.done}/${totals.tasks.length}</div><div class="stat-label">Sarcini finalizate</div></div><div class="stat"><div class="stat-value">${formatHours(totals.worked)}</div><div class="stat-label">Ore lucrate</div></div></div></div></section>
        <main class="page-main"><div class="view-bar"><span class="view-pill">👁 Vizualizare beneficiar · fără drept de modificare</span><span>Acces acordat pentru ${escapeHtml(snapshot.beneficiary.name||snapshot.beneficiary.email)}</span></div><nav class="tabs"><button class="tab ${activeTab==='tasks'?'active':''}" onclick="setTab('tasks')">Etape & sarcini</button><button class="tab ${activeTab==='team'?'active':''}" onclick="setTab('team')">Echipă</button><button class="tab ${activeTab==='reports'?'active':''}" onclick="setTab('reports')">Rapoarte</button><button class="tab ${activeTab==='changes'?'active':''}" onclick="setTab('changes')">Jurnal modificări</button><button class="tab ${activeTab==='journal'?'active':''}" onclick="setTab('journal')">Jurnal proiect</button></nav><section id="tab-content"></section></main>`;
      renderTab();
    }
    function setTab(tab){activeTab=tab;renderPortal();}
    function renderTab(){const target=document.getElementById('tab-content');if(!target)return;if(activeTab==='tasks') target.innerHTML=renderTasks();if(activeTab==='team')target.innerHTML=renderTeam();if(activeTab==='reports')target.innerHTML=renderReports();if(activeTab==='changes')target.innerHTML=renderChanges();if(activeTab==='journal')target.innerHTML=renderJournal();}
    function renderTasks(){const phases=snapshot.phases||[]; return `${snapshot.project.description?`<div class="section-card card-pad" style="margin-bottom:18px"><h2 class="section-title">Descriere proiect</h2><div style="line-height:1.65;color:#4B5563">${escapeHtml(snapshot.project.description)}</div></div>`:''}<h2 class="section-title">Etape de lucru</h2>${phases.length?phases.map((phase,index)=>{const d=phaseData(phase),color=phase.color||['#FFCB09','#3B82F6','#10B981','#F59E0B','#8B5CF6'][index%5];return `<article class="section-card"><div class="phase-head" id="phase-${phase.id}" onclick="togglePhase('${phase.id}')"><i class="phase-dot" style="background:${escapeHtml(color)}"></i><span class="phase-name">${escapeHtml(phase.code?`${phase.code}. ${phase.name}`:phase.name)}</span><span class="phase-values">${formatHours(d.worked)} / ${d.budget}h · ${d.pct}%</span><span class="chevron">›</span></div><div class="phase-progress"><div class="phase-progress-fill" style="background:${escapeHtml(color)};width:${d.pct}%"></div></div><div class="task-list" id="tasks-${phase.id}">${d.tasks.length?d.tasks.map(task=>{const pct=taskProgress(task),remaining=Math.max(0,(Number(task.budget_hours)||0)-(Number(task.minutes_worked)||0)/60);return `<div class="task-row"><div><div class="task-name">${escapeHtml(task.name)}</div>${task.description?`<div class="task-description">${escapeHtml(task.description)}</div>`:''}<div class="task-mobile-meta">${task.task_start_date||task.task_end_date?`${formatDate(task.task_start_date)} — ${formatDate(task.task_end_date)}`:'Fără perioadă'} · ${formatHours(task.minutes_worked)} / ${Number(task.budget_hours)||0}h</div></div><div class="task-period">${task.task_start_date||task.task_end_date?`${formatDate(task.task_start_date)}<br>— ${formatDate(task.task_end_date)}`:'Fără perioadă'}</div><div class="number">${Number(task.budget_hours)||0}h</div><div><div class="small-progress"><span style="width:${pct}%;background:${escapeHtml(color)}"></span></div><div class="number" style="margin-top:5px">${formatHours(task.minutes_worked)} · ${Math.round(remaining*10)/10}h rămas</div></div><div class="pct">${pct}%</div></div>`}).join(''):'<div class="empty">Nu există sarcini în această etapă.</div>'}</div></article>`}).join(''):'<div class="section-card empty">Nu există etape definite pentru acest proiect.</div>'}`;}
    function togglePhase(id){const list=document.getElementById(`tasks-${id}`),head=document.getElementById(`phase-${id}`);if(!list)return;list.classList.toggle('open');head?.classList.toggle('open');}
    function renderTeam(){const members=snapshot.members||[];return `<h2 class="section-title">Echipa proiectului</h2><div class="section-card card-pad"><div class="team-grid">${members.length?members.map(member=>`<div class="member">${member.avatar_url?`<img class="avatar" src="${escapeHtml(member.avatar_url)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'avatar-fallback',textContent:'${escapeHtml((member.name||'?').trim().charAt(0).toUpperCase())}'}))">`:`<span class="avatar-fallback">${escapeHtml((member.name||'?').trim().charAt(0).toUpperCase())}</span>`}<div><div class="member-name">${escapeHtml(member.name)}</div><div class="member-meta">${escapeHtml(member.position||member.department||'—')}</div><span class="role">${escapeHtml(roleLabel(member.role))}</span></div></div>`).join(''):'<div class="empty">Nu sunt membri înregistrați pentru acest proiect.</div>'}</div></div>`;}
    function renderReports(){const phases=snapshot.phases||[];const totals=totalData();return `<h2 class="section-title">Raport de progres</h2><div class="section-card"><div class="table-wrap"><table class="report-table"><thead><tr><th>Etapă</th><th>Buget</th><th>Lucrat</th><th>Rămas</th><th>Progres</th></tr></thead><tbody>${phases.map(phase=>{const d=phaseData(phase);return `<tr><td><strong>${escapeHtml(phase.code?`${phase.code}. ${phase.name}`:phase.name)}</strong></td><td>${d.budget}h</td><td>${formatHours(d.worked)}</td><td>${Math.max(0,Math.round((d.budget-d.worked/60)*10)/10)}h</td><td><strong>${d.pct}%</strong></td></tr>`}).join('')}<tr style="background:#FFFDF3"><td><strong>Total proiect</strong></td><td><strong>${totals.budget}h</strong></td><td><strong>${formatHours(totals.worked)}</strong></td><td><strong>${Math.max(0,Math.round((totals.budget-totals.worked/60)*10)/10)}h</strong></td><td><strong>${totals.pct}%</strong></td></tr></tbody></table></div></div>`;}
    function renderChanges(){const changes=snapshot.changes||[];return `<h2 class="section-title">Jurnal modificări</h2><div class="section-card card-pad">${changes.length?changes.map(change=>`<div class="change"><div class="change-title">${escapeHtml(change.description||`${change.change_type||'Actualizare'}: ${change.entity_name||change.entity_type||'proiect'}`)}</div><div class="change-info">${escapeHtml(change.changed_by_name||'Echipa proiectului')} · ${formatDate(change.created_at)} ${new Date(change.created_at).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}</div>${change.old_value||change.new_value?`<div class="change-values">${change.old_value?`<span class="old">Anterior: ${escapeHtml(change.old_value)}</span>`:''}${change.new_value?`<span class="new">Actual: ${escapeHtml(change.new_value)}</span>`:''}</div>`:''}</div>`).join(''):'<div class="empty">Nu există modificări înregistrate pentru acest proiect.</div>'}</div>`;}
    function renderJournal(){const decisions=snapshot.decisions||[];return `<h2 class="section-title">Jurnal proiect</h2><div class="section-card card-pad">${decisions.length?decisions.map(decision=>`<article class="decision"><div class="decision-date">În vigoare din ${formatDate(decision.decision_date||decision.created_at)}</div><div class="decision-text">${escapeHtml(decision.decision)}</div><div class="decision-meta">Decizie luată de: ${escapeHtml((decision.decision_makers||[]).join(', ')||'—')} · Completat de: ${escapeHtml(decision.completed_by||'Echipa proiectului')}</div></article>`).join(''):'<div class="empty">Nu există decizii publicate pentru acest proiect.</div>'}</div>`;}
    window.showEmailStep=showEmailStep;window.requestCode=requestCode;window.verifyCode=verifyCode;window.setTab=setTab;window.togglePhase=togglePhase;
    if(!invitationToken) errorPage('Link incomplet','Această pagină poate fi deschisă numai din invitația primită pe e-mail.'); else if(getSession()) loadSnapshot(); else showEmailStep();
  </script>
</body>
</html>
