name: Cache-Bust & Deploy
# Dezactivat - cache-bust se ruleaza local inainte de fiecare push
# Activeaza manual din GitHub Actions daca e necesar
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run cache-bust script
        run: node scripts/build-cache-bust.js

      - name: Commit updated index.html (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet index.html || (
            git add index.html &&
            git commit -m "chore: auto cache-bust [skip ci]" &&
            git push
          )
